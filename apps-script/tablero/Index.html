<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /* Tokens: papel de seguridad + tinta verde de billete. Series validadas para daltonismo (verde $100.000 / morado $50.000). */
  :root {
    color-scheme: light;
    --papel: #edf1ee; --sup: #fbfcfa; --tinta: #14261e; --tinta-2: #4a5a52; --tenue: #74827b; --linea: #dce3de; --linea-2: #c9d3cd;
    --s1: #0b7a49; --s2: #8a4fa0; --rojo: #b3392f; --bien: #0b6b3f; --aviso: #8a5a00; --realce: #e3eee7;
    --billete-a: #0f4a31; --billete-b: #1a6a45; --billete-tinta: #eaf5ee; --billete-guilloche: rgba(234, 245, 238, 0.10);
    --r-grande: 18px; --r: 12px; --r-chico: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --papel: #0e1512; --sup: #16201b; --tinta: #e8efea; --tinta-2: #b5c2ba; --tenue: #84928a; --linea: #26332c; --linea-2: #33423a;
      --s1: #2a9a63; --s2: #a066bd; --rojo: #e66767; --bien: #3cc47f; --aviso: #f0b443; --realce: #1d2c25;
      --billete-a: #0b3a26; --billete-b: #135437; --billete-guilloche: rgba(234, 245, 238, 0.08);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --papel: #0e1512; --sup: #16201b; --tinta: #e8efea; --tinta-2: #b5c2ba; --tenue: #84928a; --linea: #26332c; --linea-2: #33423a;
    --s1: #2a9a63; --s2: #a066bd; --rojo: #e66767; --bien: #3cc47f; --aviso: #f0b443; --realce: #1d2c25;
    --billete-a: #0b3a26; --billete-b: #135437; --billete-guilloche: rgba(234, 245, 238, 0.08);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--papel); color: var(--tinta); font: 15px/1.45 "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 6px; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tenue { color: var(--tenue); font-size: 13px; }

  /* Estructura: barra de pestañas abajo en el celular (al alcance del pulgar), riel a la izquierda en pantalla grande */
  header.top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 6px; max-width: 1080px; margin: 0 auto; }
  header.top h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; flex: 1; }
  .estado { font-size: 12px; color: var(--tenue); text-align: right; }
  .btn-ico { border: 1px solid var(--linea-2); background: var(--sup); border-radius: 999px; width: 38px; height: 38px; display: grid; place-items: center; font-size: 17px; }
  main { max-width: 1080px; margin: 0 auto; padding: 8px 16px calc(96px + env(safe-area-inset-bottom)); }
  section[hidden] { display: none; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--sup); border-top: 1px solid var(--linea); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  nav.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; font-size: 11px; color: var(--tenue); border-radius: 10px; }
  nav.tabs svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav.tabs button[aria-selected="true"] { color: var(--s1); font-weight: 700; }
  @media (min-width: 960px) {
    nav.tabs { top: 0; bottom: 0; right: auto; width: 200px; display: flex; flex-direction: column; gap: 4px; padding: 76px 12px 12px; border-top: 0; border-right: 1px solid var(--linea); }
    nav.tabs button { flex-direction: row; gap: 10px; font-size: 15px; padding: 10px 12px; justify-content: flex-start; }
    nav.tabs button[aria-selected="true"] { background: var(--realce); }
    header.top, main { margin-left: max(216px, calc((100vw - 1080px) / 2 + 100px)); }
    main { padding-bottom: 40px; }
  }

  /* El billete: el único elemento audaz */
  .billete { position: relative; overflow: hidden; border-radius: var(--r-grande); padding: 20px 22px 18px; color: var(--billete-tinta);
    background:
      repeating-radial-gradient(circle at 88% 30%, var(--billete-guilloche) 0 1px, transparent 1px 7px),
      repeating-radial-gradient(circle at 8% 120%, var(--billete-guilloche) 0 1px, transparent 1px 9px),
      linear-gradient(135deg, var(--billete-a), var(--billete-b)); }
  .billete::after { content: "$"; position: absolute; right: 16px; bottom: -30px; font-size: 150px; font-weight: 800; line-height: 1; opacity: 0.09; pointer-events: none; }
  .billete .rotulo { font-size: 14px; opacity: 0.85; }
  .billete .cifra { font-size: clamp(38px, 11vw, 56px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin: 2px 0 8px; }
  .billete .cambio { font-size: 14px; }
  .billete .serial { margin-top: 14px; font-size: 12px; opacity: 0.7; letter-spacing: 0.02em; }

  /* Libro: filas y celdas con divisiones finas en vez de muchas tarjetas iguales */
  .libro { background: var(--sup); border: 1px solid var(--linea); border-radius: var(--r); }
  .cuadro { display: grid; grid-template-columns: 1fr 1fr; margin-top: 12px; }
  .cuadro > button { text-align: left; border: 0; background: none; padding: 14px 16px; border-bottom: 1px solid var(--linea); }
  .cuadro > button:nth-child(odd) { border-right: 1px solid var(--linea); }
  .cuadro > button:nth-last-child(-n+2) { border-bottom: 0; }
  .cuadro .k { font-size: 13px; color: var(--tinta-2); }
  .cuadro .v { font-size: clamp(17px, 5vw, 20px); font-weight: 700; margin-top: 2px; }
  .cuadro .n { font-size: 12px; color: var(--tenue); }
  h2 { font-size: 17px; font-weight: 700; margin: 26px 2px 10px; display: flex; align-items: baseline; gap: 10px; }
  h2 .der { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--tinta-2); }
  .filas > * { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--linea); background: none; text-align: left; }
  .filas > *:last-child { border-bottom: 0; }
  .filas > button:hover { background: var(--realce); }
  .filas .cuerpo { flex: 1; min-width: 0; }
  .filas .titulo { font-weight: 600; overflow-wrap: anywhere; }
  .filas .monto { font-weight: 700; text-align: right; }
  .fecha-chip { min-width: 46px; text-align: center; line-height: 1.1; color: var(--tinta-2); font-size: 12px; }
  .fecha-chip b { display: block; font-size: 18px; color: var(--tinta); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--realce); color: var(--s1); flex: none; }
  .barra-dos { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 6px; background: var(--linea); gap: 2px; }
  .barra-dos > i { display: block; height: 100%; }
  .barra-una { height: 6px; border-radius: 3px; background: var(--linea); overflow: hidden; margin-top: 6px; }
  .barra-una > i { display: block; height: 100%; background: var(--s1); border-radius: 3px; }
  .leyenda { display: flex; gap: 14px; font-size: 12px; color: var(--tinta-2); margin: -4px 2px 8px; }
  .leyenda i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .chevron { transition: transform 0.18s ease; color: var(--tenue); flex: none; }
  [aria-expanded="true"] .chevron { transform: rotate(90deg); }
  .filas > .hijos { display: block; padding: 0; background: var(--papel); }
  .hijos > * { padding-left: 30px; }
  .graf { padding: 12px 10px 6px; }
  .graf .lienzo { position: relative; height: 230px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: none; }
  .chip { border: 1px solid var(--linea-2); background: var(--sup); border-radius: 999px; padding: 7px 14px; white-space: nowrap; font-size: 14px; }
  .chip[aria-pressed="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
  .tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tres > div { padding: 12px 12px; border-right: 1px solid var(--linea); min-width: 0; }
  .tres > div:last-child { border-right: 0; }
  .tres .k { font-size: 12px; color: var(--tinta-2); } .tres .v { font-weight: 700; font-size: clamp(14px, 4.1vw, 17px); }
  .busca { display: flex; gap: 8px; }
  .busca input { flex: 1; min-width: 0; border: 1px solid var(--linea-2); border-radius: var(--r-chico); background: var(--sup); padding: 10px 12px; }
  .filtros { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px; }
  .filtros select, .filtros input { width: 100%; border: 1px solid var(--linea-2); border-radius: var(--r-chico); background: var(--sup); padding: 9px 10px; min-width: 0; }
  .activos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .activos button { border: 0; background: var(--realce); border-radius: 999px; padding: 4px 10px; font-size: 13px; }
  .dia-titulo { padding: 8px 14px; font-size: 13px; font-weight: 700; color: var(--tinta-2); background: var(--papel); border-bottom: 1px solid var(--linea); }
  details.mov { border-bottom: 1px solid var(--linea); }
  details.mov summary { list-style: none; display: flex; gap: 12px; padding: 11px 14px; cursor: pointer; }
  details.mov summary::-webkit-details-marker { display: none; }
  details.mov .extra { padding: 0 14px 12px 14px; font-size: 13px; color: var(--tinta-2); display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
  .signo-mas { color: var(--bien); } .signo-menos { color: var(--tinta); }
  .vacio { padding: 22px 16px; text-align: center; color: var(--tenue); }
  .mas { display: block; margin: 12px auto 0; border: 1px solid var(--linea-2); background: var(--sup); border-radius: 999px; padding: 8px 18px; }
  .aviso-error { border: 1px solid var(--rojo); border-radius: var(--r); padding: 12px 14px; margin: 8px 0; }
  .total-inv { padding: 16px; }
  .total-inv .v { font-size: 30px; font-weight: 800; letter-spacing: -0.01em; }
  .sube { color: var(--bien); } .baja { color: var(--rojo); }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--linea-2); color: var(--tinta-2); white-space: nowrap; }
  .tachado .titulo, .tachado .monto { text-decoration: line-through; color: var(--tenue); }
  .dos-col { display: grid; gap: 0 18px; }
  @media (min-width: 960px) { .dos-col { grid-template-columns: 1fr 1fr; align-items: start; } }

  /* Hoja de detalle: sube desde abajo en el celular, panel a la derecha en pantalla grande */
  dialog.hoja { border: 0; padding: 0; margin: auto 0 0; width: 100%; max-width: 100%; max-height: 88vh; border-radius: var(--r-grande) var(--r-grande) 0 0;
    background: var(--papel); color: var(--tinta); box-shadow: 0 -8px 30px rgba(0,0,0,0.18); }
  dialog.hoja::backdrop { background: rgba(10, 20, 15, 0.45); }
  dialog.hoja[open] { animation: subir 0.22s ease-out; }
  @keyframes subir { from { transform: translateY(40px); opacity: 0.4; } to { transform: none; opacity: 1; } }
  @media (min-width: 960px) {
    dialog.hoja { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: 460px; border-radius: 0; }
    @keyframes subir { from { transform: translateX(40px); opacity: 0.4; } to { transform: none; opacity: 1; } }
  }
  @media (prefers-reduced-motion: reduce) { dialog.hoja[open] { animation: none; } .chevron { transition: none; } }
  .hoja-cab { position: sticky; top: 0; background: var(--papel); display: flex; align-items: flex-start; gap: 12px; padding: 16px 16px 10px; border-bottom: 1px solid var(--linea); z-index: 1; }
  .hoja-cab h3 { margin: 0; font-size: 20px; font-weight: 800; }
  .hoja-cab .cerrar { margin-left: auto; }
  .hoja-cuerpo { padding: 4px 16px 28px; overflow-y: auto; }
  .hoja-cuerpo h4 { margin: 20px 2px 8px; font-size: 15px; }
  .agarre { width: 40px; height: 4px; border-radius: 2px; background: var(--linea-2); margin: 8px auto 0; }
  @media (min-width: 960px) { .agarre { display: none; } }
</style>
</head>
<body>
<header class="top">
  <h1>Mis finanzas</h1>
  <div class="estado" id="estado" aria-live="polite">Cargando…</div>
  <button class="btn-ico" id="recargar" aria-label="Actualizar ahora" title="Actualizar ahora">↻</button>
</header>

<main>
  <div id="mensaje"></div>

  <section id="inicio">
    <div class="billete" aria-label="Patrimonio neto">
      <div class="rotulo">Patrimonio neto</div>
      <div class="cifra num" id="i-patrimonio">—</div>
      <div class="cambio" id="i-cambio"></div>
      <div class="serial" id="i-serial"></div>
    </div>
    <div class="libro cuadro" id="i-cuadro"></div>
    <div class="dos-col">
      <div><h2>Lo que viene</h2><div class="libro filas" id="i-viene"></div></div>
      <div>
        <h2>Patrimonio semana a semana</h2>
        <div class="libro graf"><div class="lienzo"><canvas id="g-patrimonio" aria-label="Patrimonio neto semana a semana"></canvas></div><div class="tenue" id="i-nota-pat" style="padding:4px 6px"></div></div>
        <h2>Gasto por mes</h2><div class="tenue" style="margin:-6px 2px 8px">Toca un mes para ver en qué se fue.</div>
        <div class="libro graf"><div class="lienzo"><canvas id="g-gastomes" aria-label="Gasto total por mes"></canvas></div></div>
      </div>
    </div>
  </section>

  <section id="gastos" hidden>
    <div class="chips" id="gs-meses" role="group" aria-label="Mes"></div>
    <div class="libro tres" id="gs-resumen"></div>
    <div class="dos-col">
      <div><h2>Por categoría</h2><div class="tenue" style="margin:-6px 2px 8px">Toca una categoría para ver sus gastos.</div><div class="libro filas" id="gs-cats"></div></div>
      <div><h2>Presupuesto</h2><div class="libro filas" id="gs-pres"></div></div>
    </div>
  </section>

  <section id="movimientos" hidden>
    <div class="busca"><input type="search" id="m-buscar" placeholder="Buscar en el detalle, persona o categoría" aria-label="Buscar movimientos"></div>
    <div class="filtros">
      <select id="m-tipo" aria-label="Tipo"></select>
      <select id="m-cuenta" aria-label="Cuenta"></select>
      <select id="m-persona" aria-label="Persona"></select>
      <select id="m-cat" aria-label="Categoría"></select>
      <input type="date" id="m-desde" aria-label="Desde">
      <input type="date" id="m-hasta" aria-label="Hasta">
    </div>
    <div class="activos" id="m-activos"></div>
    <div class="libro tres" id="m-resumen" style="margin-top:10px"></div>
    <div class="libro" id="m-lista" style="margin-top:12px; overflow:hidden"></div>
    <button class="mas" id="m-mas" hidden>Ver más movimientos</button>
  </section>

  <section id="deudas" hidden>
    <div class="libro cuadro" id="d-cuadro" style="margin-top:4px"></div>
    <div class="dos-col">
      <div>
        <h2>Te deben <span class="der num" id="d-total-deben"></span></h2>
        <div class="leyenda"><span><i style="background:var(--s1)"></i>Suelto</span><span><i style="background:var(--s2)"></i>En cuotas</span></div>
        <div class="libro filas" id="d-deben"></div>
        <h2>Próximas cuotas</h2>
        <div class="libro filas" id="d-cuotas"></div>
      </div>
      <div id="debo">
        <h2>Tú debes <span class="der num" id="d-total-debo"></span></h2>
        <div class="libro filas" id="d-debo"></div>
      </div>
    </div>
  </section>

  <section id="cuentas" hidden>
    <div class="dos-col">
      <div><h2>Cuentas <span class="der num" id="c-disp"></span></h2><div class="libro filas" id="c-arbol"></div></div>
      <div id="inversiones">
        <h2>Inversiones</h2>
        <div class="libro total-inv" id="c-inv-total"></div>
        <div class="libro filas" id="c-inv" style="margin-top:12px"></div>
      </div>
    </div>
  </section>
</main>

<nav class="tabs" role="tablist" aria-label="Secciones" id="tabs">
  <button role="tab" data-tab="inicio" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Inicio</button>
  <button role="tab" data-tab="gastos"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>Gastos</button>
  <button role="tab" data-tab="movimientos"><svg viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>Movimientos</button>
  <button role="tab" data-tab="deudas"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M17 7.5h5"/><path d="M19.5 5v5"/></svg>Deudas</button>
  <button role="tab" data-tab="cuentas"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/><path d="M16 15h2.5"/></svg>Cuentas</button>
</nav>

<dialog class="hoja" id="hoja" aria-labelledby="hoja-titulo">
  <div class="agarre" aria-hidden="true"></div>
  <div class="hoja-cab"><div><h3 id="hoja-titulo"></h3><div class="tenue" id="hoja-sub"></div></div><button class="btn-ico cerrar" id="hoja-cerrar" aria-label="Cerrar">✕</button></div>
  <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
</dialog>

<script>
(function () {
  'use strict';
  const REFRESCO_MS = 5 * 60 * 1000;
  const FUENTE = '"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif';
  let D = null, cargando = false, movVisibles = 60, mesGastos = null;
  const charts = {}, abiertas = new Set();
  const $ = id => document.getElementById(id);
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pesos = n => (n < 0 ? '-$' : '$') + String(Math.abs(Math.round(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
  const fCorta = s => { if (!s) return ''; const [, m, d] = String(s).split('-'); return `${+d} ${MESES[+m - 1]}`; };
  const fLarga = s => { if (!s) return ''; const [y, m, d] = String(s).split('-'); return `${+d} de ${MESES_L[+m - 1]}${y !== (D && D.hoy || '').slice(0, 4) ? ' de ' + y : ''}`; };
  const nomMes = s => { const [y, m] = String(s).split('-'); return `${MESES_L[+m - 1]} ${y}`; };
  const mesCorto = s => { const [y, m] = String(s).split('-'); return `${MESES[+m - 1]} ${String(y).slice(2)}`; };
  const pct = x => (x >= 0 ? '+' : '−') + String(Math.abs(Math.round(x * 1000) / 10)).replace('.', ',') + ' %';
  // Textos que llegan del banco en MAYÚSCULAS ("MERCADO PAGO CLEVERCEL") se muestran como "Mercado Pago Clevercel"
  const bonito = s => { const t = String(s == null ? '' : s); return t.length > 3 && t === t.toUpperCase() && /[A-ZÁÉÍÓÚÑ]{3}/.test(t) ? t.toLowerCase().replace(/(^|[\s(/-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()) : t; };
  const inicial = n => esc(String(n || '?').trim().charAt(0).toUpperCase());
  const fechaChip = f => { if (!f) return '<div class="fecha-chip"></div>'; const [, m, d] = f.split('-'); return `<div class="fecha-chip"><b>${+d}</b>${MESES[+m - 1]}</div>`; };
  const eje = (v, i, ticks) => { const paso = ticks && ticks.length > 1 ? Math.abs(ticks[1].value - ticks[0].value) : Math.abs(v); const a = Math.abs(v), sg = v < 0 ? '-$' : '$';
    if (a >= 1e6 || paso >= 1e6) { const dec = paso >= 1e6 ? 0 : paso >= 1e5 ? 1 : 2; return sg + (a / 1e6).toFixed(dec).replace('.', ',') + ' M'; }
    if (a >= 1e3) return sg + Math.round(a / 1e3) + ' mil'; return sg + Math.round(a); };

  // ---------- Datos ----------
  function cargar() {
    if (cargando) return; cargando = true; $('estado').textContent = 'Actualizando…';
    const ok = d => { cargando = false; D = d; $('mensaje').innerHTML = ''; $('estado').innerHTML = `Al día<br>${esc(d.generado.slice(11))}`; pintar(); };
    const mal = e => { cargando = false; $('estado').textContent = 'Sin conexión';
      $('mensaje').innerHTML = `<div class="aviso-error">No pude leer la hoja (${esc(e && e.message || e)}). Revisa tu conexión y toca ↻.</div>`; };
    if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(ok).withFailureHandler(mal).getDatos();
    else mal('esta página se abre desde Apps Script');
  }

  // ---------- Navegación ----------
  function ir(tab, despues) {
    document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === tab)));
    document.querySelectorAll('main > section').forEach(s => { s.hidden = s.id !== tab; });
    try { localStorage.setItem('tablero.tab', tab); } catch (e) {}
    window.scrollTo(0, 0);
    Object.values(charts).forEach(c => c.resize());
    if (despues) setTimeout(despues, 30);
  }
  function verMovimientos(filtro) {
    $('m-buscar').value = ''; ['m-tipo', 'm-cuenta', 'm-persona', 'm-cat', 'm-desde', 'm-hasta'].forEach(id => { $(id).value = ''; });
    Object.entries(filtro || {}).forEach(([k, v]) => { const el = $(k); if (!el) return; if (el.tagName === 'SELECT' && ![...el.options].some(o => o.value === v)) el.add(new Option(v, v)); el.value = v; });
    movVisibles = 60; cerrarHoja(); ir('movimientos'); pintarMovimientos();
  }

  // ---------- Gráficas ----------
  function base(extra) {
    const linea = css('--linea'), tenue = css('--tenue');
    return Object.assign({ responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + pesos(c.parsed.y) } } },
      scales: { x: { grid: { display: false }, border: { color: css('--linea-2') }, ticks: { color: tenue, font: { size: 11, family: FUENTE } } },
        y: { grid: { color: linea, drawTicks: false }, border: { display: false }, ticks: { color: tenue, font: { size: 11, family: FUENTE }, maxTicksLimit: 5, callback: eje } } } }, extra || {});
  }
  function grafica(id, config) { if (!window.Chart) return; if (charts[id]) charts[id].destroy(); charts[id] = new Chart($(id), config); }

  // ---------- Pintar ----------
  function pintar() { if (!D) return; pintarInicio(); pintarGastos(); llenarFiltros(); pintarMovimientos(); pintarDeudas(); pintarCuentas(); }

  function pintarInicio() {
    const k = D.kpis;
    $('i-patrimonio').textContent = pesos(k.patrimonio);
    const h = D.historial.filter(x => x.fecha < D.hoy);
    if (h.length) { const d = k.patrimonio - h[h.length - 1].patrimonio; $('i-cambio').textContent = `${d >= 0 ? '▲' : '▼'} ${pesos(Math.abs(d))} desde el ${fLarga(h[h.length - 1].fecha)}`; }
    else $('i-cambio').textContent = 'Lo que tienes, más lo que te deben, menos lo que debes';
    $('i-serial').textContent = `Calculado el ${fLarga(D.hoy)} a las ${D.generado.slice(11)}`;
    const celda = (k2, v, n, tab, ancla) => `<button data-ir="${tab}" data-ancla="${ancla || ''}"><div class="k">${esc(k2)}</div><div class="v num">${esc(v)}</div><div class="n">${esc(n)}</div></button>`;
    $('i-cuadro').innerHTML = celda('Disponible', pesos(k.disponible), k.cdt ? `más ${pesos(k.cdt)} en CDT` : 'cuentas y bolsillos', 'cuentas') +
      celda('Inversiones', pesos(k.inversiones), `dólar a ${pesos(D.usdcop)}`, 'cuentas', 'inversiones') +
      celda('Te deben', pesos(k.meDeben), `${D.deudores.length} ${D.deudores.length === 1 ? 'persona' : 'personas'}`, 'deudas') +
      celda('Tú debes', pesos(k.deudaTarjetas + k.yoDebo), D.tarjetas.length ? 'tarjeta y personas' : 'personas', 'deudas', 'debo');
    // Lo que viene
    const filas = [...D.tarjetas.filter(t => t.deuda > 0).map(t => ({ f: t.prox, t: `Pago de ${t.nombre}`, s: `mínimo aproximado ${pesos(t.minimo)}`, v: t.deuda, accion: `tarjeta:${t.nombre}` })),
      ...D.cuotasProximas.slice(0, 8).map(q => ({ f: q.fecha, t: `${q.persona} te paga la cuota ${q.n}`, s: q.vencida ? 'vencida, sigue pendiente' : `préstamo ${q.prestamo}`, v: q.valor, accion: `persona:${q.persona}`, alerta: q.vencida }))]
      .sort((a, b) => a.f < b.f ? -1 : 1).slice(0, 6);
    $('i-viene').innerHTML = filas.length ? filas.map(x => `<button data-abrir="${esc(x.accion)}">${fechaChip(x.f)}<div class="cuerpo"><div class="titulo">${x.alerta ? '⚠️ ' : ''}${esc(x.t)}</div><div class="tenue">${esc(x.s)}</div></div><div class="monto num">${esc(pesos(x.v))}</div></button>`).join('')
      : '<div class="vacio">Nada pendiente por ahora.</div>';
    const serie = [...h.slice(-25), { fecha: D.hoy, patrimonio: k.patrimonio }];
    $('i-nota-pat').textContent = serie.length < 3 ? 'Cada domingo se guarda una foto en la pestaña Historial; la línea crece con ellas.' : '';
    grafica('g-patrimonio', { type: 'line', data: { labels: serie.map(x => fCorta(x.fecha)), datasets: [{ data: serie.map(x => x.patrimonio), borderColor: css('--s1'), backgroundColor: css('--s1'), borderWidth: 2, pointRadius: 4, pointHoverRadius: 7, tension: 0.25 }] }, options: base() });
    const meses = Object.keys(D.gastosMes).sort().slice(-6);
    grafica('g-gastomes', { type: 'bar', data: { labels: meses.map(mesCorto), datasets: [{ data: meses.map(m => Object.values(D.gastosMes[m]).reduce((s, v) => s + v, 0)), backgroundColor: css('--s1'), borderRadius: 4, maxBarThickness: 40 }] },
      options: base({ onClick: (e, els) => { if (els.length) { mesGastos = meses[els[0].index]; pintarGastos(); ir('gastos'); } }, onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; } }) });
  }

  function pintarGastos() {
    const meses = Object.keys(D.gastosMes).sort().reverse();
    if (!meses.includes(D.mesActual)) meses.unshift(D.mesActual);
    if (!mesGastos || !meses.includes(mesGastos)) mesGastos = D.mesActual;
    $('gs-meses').innerHTML = meses.map(m => `<button class="chip" data-mes="${esc(m)}" aria-pressed="${m === mesGastos}">${esc(nomMes(m))}</button>`).join('');
    const cats = Object.entries(D.gastosMes[mesGastos] || {}).sort((a, b) => b[1] - a[1]);
    const tot = cats.reduce((s, c) => s + c[1], 0), ing = D.ingresosMes[mesGastos] || 0, dif = ing - tot;
    $('gs-resumen').innerHTML = `<div><div class="k">Gastaste</div><div class="v num">${esc(pesos(tot))}</div></div><div><div class="k">Entró</div><div class="v num">${esc(pesos(ing))}</div></div>` +
      `<div><div class="k">${dif >= 0 ? 'Te quedó' : 'Faltó'}</div><div class="v num ${dif >= 0 ? 'sube' : 'baja'}">${esc(pesos(Math.abs(dif)))}</div></div>`;
    const max = cats.length ? cats[0][1] : 1;
    $('gs-cats').innerHTML = cats.length ? cats.map(([c, v]) => `<button data-cat="${esc(c)}"><div class="cuerpo"><div class="titulo">${esc(c)}</div><div class="barra-una"><i style="width:${Math.max(2, Math.round(v * 100 / max))}%"></i></div></div><div class="monto num">${esc(pesos(v))}<div class="tenue">${Math.round(v * 100 / (tot || 1))} %</div></div></button>`).join('')
      : `<div class="vacio">No hay gastos registrados en ${esc(nomMes(mesGastos))}.</div>`;
    const pres = D.presupuestos.filter(p => p.mes === mesGastos);
    $('gs-pres').innerHTML = pres.length ? pres.map(p => { const g = (D.gastosMes[mesGastos] || {})[p.categoria] || 0, r = p.monto ? g / p.monto : 0;
      const est = r >= 1 ? `🚨 te pasaste ${pesos(g - p.monto)}` : r >= 0.8 ? `⚠️ quedan ${pesos(p.monto - g)}` : `quedan ${pesos(p.monto - g)}`;
      return `<div><div class="cuerpo"><div class="titulo">${esc(p.categoria)}</div><div class="barra-una"><i style="width:${Math.min(100, Math.round(r * 100))}%;background:${r >= 1 ? 'var(--rojo)' : r >= 0.8 ? 'var(--aviso)' : 'var(--s1)'}"></i></div><div class="tenue">${esc(est)}</div></div><div class="monto num">${esc(pesos(g))}<div class="tenue">de ${esc(pesos(p.monto))}</div></div></div>`; }).join('')
      : `<div class="vacio">Sin presupuesto para ${esc(nomMes(mesGastos))}. Escríbele al bot, por ejemplo: "pon 400 mil para comida".</div>`;
  }

  // ---------- Movimientos ----------
  function opciones(sel, valores, todos) { const v = sel.value; sel.innerHTML = `<option value="">${esc(todos)}</option>` + valores.map(x => `<option${x === v ? ' selected' : ''}>${esc(x)}</option>`).join(''); }
  function llenarFiltros() {
    const u = f => [...new Set(D.movimientos.map(f).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
    opciones($('m-tipo'), u(m => m.t), 'Todos los tipos'); opciones($('m-cuenta'), u(m => m.c), 'Todas las cuentas');
    opciones($('m-persona'), u(m => m.p), 'Todas las personas'); opciones($('m-cat'), u(m => m.k), 'Todas las categorías');
  }
  const sinTilde = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  function pintarMovimientos() {
    if (!D) return;
    const q = sinTilde($('m-buscar').value.trim()), f = { tipo: $('m-tipo').value, cuenta: $('m-cuenta').value, persona: $('m-persona').value, cat: $('m-cat').value, desde: $('m-desde').value, hasta: $('m-hasta').value };
    const lista = D.movimientos.filter(m => (!f.tipo || m.t === f.tipo) && (!f.cuenta || m.c === f.cuenta || m.d === f.cuenta) && (!f.persona || m.p === f.persona) && (!f.cat || m.k === f.cat) &&
      (!f.desde || m.f >= f.desde) && (!f.hasta || m.f <= f.hasta) && (!q || sinTilde([m.x, m.p, m.k, m.c, m.t].join(' ')).includes(q)));
    const nombres = { tipo: 'm-tipo', cuenta: 'm-cuenta', persona: 'm-persona', cat: 'm-cat', desde: 'm-desde', hasta: 'm-hasta' };
    $('m-activos').innerHTML = Object.entries(f).filter(([, v]) => v).map(([k, v]) => `<button data-quitar="${nombres[k]}" aria-label="Quitar filtro ${esc(v)}">${k === 'desde' ? 'desde ' : k === 'hasta' ? 'hasta ' : ''}${esc(k === 'desde' || k === 'hasta' ? fCorta(v) : v)} ✕</button>`).join('');
    const ent = lista.filter(m => m.s > 0).reduce((s, m) => s + m.m, 0), sal = lista.filter(m => m.s < 0).reduce((s, m) => s + m.m, 0);
    $('m-resumen').innerHTML = `<div><div class="k">Movimientos</div><div class="v num">${lista.length}</div></div><div><div class="k">Entró</div><div class="v num">${esc(pesos(ent))}</div></div><div><div class="k">Salió</div><div class="v num">${esc(pesos(sal))}</div></div>`;
    let html = '', ultimo = '';
    for (const m of lista.slice(0, movVisibles)) {
      if (m.f !== ultimo) { html += `<div class="dia-titulo">${esc(fLarga(m.f))}</div>`; ultimo = m.f; }
      const signo = m.s > 0 ? '+' : m.s < 0 ? '−' : '';
      html += `<details class="mov"><summary><div class="cuerpo" style="flex:1;min-width:0"><div class="titulo" style="font-weight:600;overflow-wrap:anywhere">${esc(bonito(m.x) || m.t)}</div><div class="tenue">${esc(m.t)}${m.p ? ', ' + esc(m.p) : ''}</div></div>` +
        `<div class="monto num ${m.s > 0 ? 'signo-mas' : 'signo-menos'}" style="font-weight:700">${signo}${esc(pesos(m.m).replace('-', ''))}</div></summary>` +
        `<div class="extra"><span>Cuenta</span><span>${esc(m.c || 'sin cuenta')}${m.d ? ' hacia ' + esc(m.d) : ''}</span>${m.k ? `<span>Categoría</span><span>${esc(m.k)}</span>` : ''}${m.p ? `<span>Persona</span><span>${esc(m.p)}</span>` : ''}<span>Fecha</span><span>${esc(fLarga(m.f))}</span></div></details>`;
    }
    $('m-lista').innerHTML = html || '<div class="vacio">Ningún movimiento coincide con esos filtros. Quita alguno para ver más.</div>';
    $('m-mas').hidden = lista.length <= movVisibles;
  }

  // ---------- Deudas ----------
  function pintarDeudas() {
    const k = D.kpis, cuotas = D.deudores.reduce((s, x) => s + x.cuotas, 0), suelto = D.deudores.reduce((s, x) => s + Math.max(0, x.informal), 0);
    $('d-cuadro').innerHTML = `<button data-ir="deudas"><div class="k">Te deben</div><div class="v num">${esc(pesos(k.meDeben))}</div><div class="n">${esc(pesos(suelto))} suelto, ${esc(pesos(cuotas))} en cuotas</div></button>` +
      `<button data-ir="deudas" data-ancla="debo"><div class="k">Tú debes</div><div class="v num">${esc(pesos(k.deudaTarjetas + k.yoDebo))}</div><div class="n">tarjeta y personas</div></button>`;
    $('d-total-deben').textContent = pesos(k.meDeben);
    const max = D.deudores.length ? D.deudores[0].total : 1;
    $('d-deben').innerHTML = D.deudores.length ? D.deudores.map(x => {
      const sub = [x.informal > 0 && x.dias !== null ? `suelto desde el ${fLarga(x.desde)}${x.dias >= 30 ? ` (${x.dias} días)` : ''}` : '', x.cuotas > 0 ? `${(x.detalle.prestamos.reduce((s, p) => s + p.cuotas.filter(q => !['Pagada', 'Anulada'].includes(q.estado)).length, 0))} cuotas pendientes` : ''].filter(Boolean).join(', ');
      const w = v => Math.max(0, Math.round(v * 100 / max));
      return `<button data-abrir="persona:${esc(x.nombre)}"><div class="avatar" aria-hidden="true">${inicial(x.nombre)}</div><div class="cuerpo"><div class="titulo">${x.dias >= 30 ? '⚠️ ' : ''}${esc(x.nombre)}</div><div class="tenue">${esc(sub)}</div>` +
        `<div class="barra-dos" aria-hidden="true" style="width:${w(x.total)}%">${x.informal > 0 ? `<i style="flex:${x.informal};background:var(--s1)"></i>` : ''}${x.cuotas > 0 ? `<i style="flex:${x.cuotas};background:var(--s2)"></i>` : ''}</div></div><div class="monto num">${esc(pesos(x.total))}</div><span class="chevron" aria-hidden="true">›</span></button>`;
    }).join('') : '<div class="vacio">Nadie te debe. Cuando prestes, díselo al bot: "le presté 50 mil a Juan".</div>';
    $('d-cuotas').innerHTML = D.cuotasProximas.length ? D.cuotasProximas.slice(0, 10).map(q => `<button data-abrir="persona:${esc(q.persona)}">${fechaChip(q.fecha)}<div class="cuerpo"><div class="titulo">${q.vencida ? '⚠️ ' : ''}${esc(q.persona)}</div><div class="tenue">cuota ${q.n} del préstamo ${esc(q.prestamo)}${q.vencida ? ', vencida' : ''}</div></div><div class="monto num">${esc(pesos(q.valor))}</div></button>`).join('')
      : '<div class="vacio">No hay cuotas por cobrar en los próximos 90 días.</div>';
    $('d-total-debo').textContent = pesos(k.deudaTarjetas + k.yoDebo);
    const debo = [...D.tarjetas.filter(t => t.deuda > 0).map(t => `<button data-abrir="tarjeta:${esc(t.nombre)}"><div class="avatar" aria-hidden="true">💳</div><div class="cuerpo"><div class="titulo">${esc(t.nombre)}</div><div class="tenue">paga el ${esc(fLarga(t.prox))}, mínimo aproximado ${esc(pesos(t.minimo))}</div>${t.cupo ? `<div class="barra-una"><i style="width:${Math.min(100, Math.round(t.deuda * 100 / t.cupo))}%;background:var(--rojo)"></i></div><div class="tenue">usas ${Math.round(t.deuda * 100 / t.cupo)} % del cupo, libre ${esc(pesos(t.disponible))}</div>` : ''}</div><div class="monto num">${esc(pesos(t.deuda))}</div><span class="chevron" aria-hidden="true">›</span></button>`),
      ...D.acreedores.map(a => `<button data-abrir="acreedor:${esc(a.nombre)}"><div class="avatar" aria-hidden="true">${inicial(a.nombre)}</div><div class="cuerpo"><div class="titulo">${esc(a.nombre)}</div><div class="tenue">le debes</div></div><div class="monto num">${esc(pesos(a.monto))}</div><span class="chevron" aria-hidden="true">›</span></button>`)];
    $('d-debo').innerHTML = debo.length ? debo.join('') : '<div class="vacio">No debes nada.</div>';
  }

  // ---------- Cuentas e inversiones ----------
  function pintarCuentas() {
    const cs = D.cuentas, hijosDe = id => cs.filter(h => h.padre === id), raiz = cs.filter(c => !c.padre || !cs.some(p => p.id === c.padre));
    $('c-disp').textContent = `disponible ${pesos(D.kpis.disponible)}`;
    $('c-arbol').innerHTML = raiz.map(c => {
      const hs = hijosDe(c.id), total = c.saldo + hs.reduce((s, h) => s + h.saldo, 0), abierta = abiertas.has(c.id);
      const fila = `<button ${hs.length ? `data-plegar="${esc(c.id)}" aria-expanded="${abierta}"` : `data-abrir="cuenta:${esc(c.id)}"`}><div class="cuerpo"><div class="titulo">${esc(c.nombre)}</div><div class="tenue">${hs.length ? `${esc(c.tipo)}, ${pesos(c.saldo)} propios y ${hs.length} ${hs.length === 1 ? 'bolsillo' : 'bolsillos'}` : esc(c.tipo) + (c.vence ? `, vence el ${esc(fLarga(c.vence))}` : '')}</div></div><div class="monto num">${esc(pesos(total))}</div><span class="chevron" aria-hidden="true">›</span></button>`;

        hs.map(h => `<button data-abrir="cuenta:${esc(h.id)}"><div class="cuerpo"><div class="titulo">${esc(h.nombre)}</div><div class="tenue">${esc(h.tipo)}${h.vence ? `, vence el ${esc(fLarga(h.vence))}` : ''}</div></div><div class="monto num">${esc(pesos(h.saldo))}</div></button>`).join('') + '</div>' : '';
      return fila + sub;
    }).join('');
    const inv = D.inversiones, tot = inv.reduce((s, i) => s + i.valor, 0), costo = inv.reduce((s, i) => s + i.costo, 0), gan = tot - costo;
    $('c-inv-total').innerHTML = inv.length ? `<div class="tenue">Total en inversiones</div><div class="v num">${esc(pesos(tot))}</div>` +
      `<div class="${gan >= 0 ? 'sube' : 'baja'}" style="font-weight:600">${gan >= 0 ? '▲' : '▼'} ${esc(pesos(Math.abs(gan)))} (${esc(pct(costo ? gan / costo : 0))})</div><div class="tenue">invertiste ${esc(pesos(costo))}, dólar a ${esc(pesos(D.usdcop))}</div>`
      : '<div class="vacio">Sin inversiones registradas.</div>';
    $('c-inv').innerHTML = inv.map(i => `<div><div class="cuerpo"><div class="titulo">${esc(i.simbolo)} <span class="tenue">${esc(i.nombre)}, ${esc(i.cuenta)}</span></div><div class="barra-una"><i style="width:${Math.max(1, Math.round(i.valor * 100 / (tot || 1)))}%"></i></div><div class="tenue">${i.valor * 100 / (tot || 1) < 1 ? 'menos de 1' : String(Math.round(i.valor * 1000 / (tot || 1)) / 10).replace('.', ',')} % del total, costó ${esc(pesos(i.costo))}</div></div>` +
      `<div class="monto num">${esc(pesos(i.valor))}${i.pct === null || Math.abs(i.ganancia) < 1 ? '' : `<div class="${i.ganancia >= 0 ? 'sube' : 'baja'}" style="font-size:13px">${i.ganancia >= 0 ? '▲' : '▼'} ${esc(pct(i.pct))}</div>`}</div></div>`).join('');
  }

  // ---------- Hoja de detalle ----------
  const hoja = $('hoja');
  function abrirHoja(titulo, sub, html) {
    $('hoja-titulo').textContent = titulo; $('hoja-sub').textContent = sub || ''; $('hoja-cuerpo').innerHTML = html; $('hoja-cuerpo').scrollTop = 0;
    if (!hoja.open) { if (hoja.showModal) hoja.showModal(); else hoja.setAttribute('open', ''); }
  }
  function cerrarHoja() { if (hoja.open) { if (hoja.close) hoja.close(); else hoja.removeAttribute('open'); } }
  const fila = (f, titulo, sub, monto, extraCls) => `<div class="${extraCls || ''}">${f ? fechaChip(f) : ''}<div class="cuerpo"><div class="titulo">${titulo}</div>${sub ? `<div class="tenue">${sub}</div>` : ''}</div><div class="monto num">${monto}</div></div>`;

  function detallePersona(nombre) {
    const x = D.deudores.find(d => d.nombre === nombre); if (!x) return;
    const det = x.detalle, cuadro = `<div class="libro tres" style="margin-top:12px"><div><div class="k">Te debe</div><div class="v num">${esc(pesos(x.total))}</div></div><div><div class="k">Suelto</div><div class="v num">${esc(pesos(Math.max(0, x.informal)))}</div></div><div><div class="k">En cuotas</div><div class="v num">${esc(pesos(x.cuotas))}</div></div></div>`;
    let h = cuadro;
    if (det.items.length) {
      h += `<h4>Lo que te debe</h4><div class="libro filas">` + det.items.map(it => fila(it.f, esc(bonito(it.x)), [it.c ? 'pagado con ' + esc(it.c) : '', it.estado === 'pagado' ? '✓ ya te lo pagó' : it.estado === 'parcial' ? `abonó una parte, queda ${esc(pesos(it.queda))}` : ''].filter(Boolean).join(', '),
        esc(pesos(it.m)), it.estado === 'pagado' ? 'tachado' : '')).join('') + '</div>';
    }
    h += `<h4>Abonos que te ha hecho</h4>` + (det.abonos.length ? `<div class="libro filas">` + det.abonos.map(a => fila(a.f, esc(a.x), a.c ? 'llegó a ' + esc(a.c) : '', '+' + esc(pesos(a.m)))).join('') + '</div>'
      : `<div class="libro vacio">Todavía no te ha abonado nada de lo suelto.</div>`);
    for (const p of det.prestamos) {
      const pag = p.cuotas.filter(q => q.estado === 'Pagada').length, n = p.cuotas.filter(q => q.estado !== 'Anulada').length;
      h += `<h4>Préstamo ${esc(p.id)}</h4><div class="libro" style="padding:12px 14px"><div>${esc(pesos(p.monto))} en ${n} cuotas de ${esc(pesos(p.valor))}${p.frecuencia ? ', ' + esc(p.frecuencia.toLowerCase()) : ''}</div>` +
        `<div class="barra-una" style="margin-top:8px"><i style="width:${Math.round(pag * 100 / (n || 1))}%;background:var(--s2)"></i></div><div class="tenue">${pag} de ${n} cuotas pagadas</div>${p.notas ? `<div class="tenue">${esc(p.notas)}</div>` : ''}</div>` +
        `<div class="libro filas" style="margin-top:8px">` + p.cuotas.filter(q => q.estado !== 'Anulada').map(q => fila(q.fecha, `Cuota ${q.n}`,
          q.estado === 'Pagada' ? '✓ pagada' : q.recibido > 0 ? `abonó ${esc(pesos(q.recibido))}, faltan ${esc(pesos(q.valor - q.recibido))}` : q.vencida ? '⚠️ vencida' : 'pendiente', esc(pesos(q.valor)), q.estado === 'Pagada' ? 'tachado' : '')).join('') + '</div>';
    }
    if (det.cobros.length) h += `<h4>Pagos de cuotas</h4><div class="libro filas">` + det.cobros.map(a => fila(a.f, esc(a.x), a.c ? 'llegó a ' + esc(a.c) : '', '+' + esc(pesos(a.m)))).join('') + '</div>';
    if (x.yoDebo > 0) h += `<h4>Tú le debes</h4><div class="libro filas">${fila('', esc(pesos(x.yoDebo)), '', '')}</div>`;
    h += `<button class="mas" data-movs-persona="${esc(nombre)}">Ver todos sus movimientos</button>`;
    abrirHoja(nombre, x.relacion ? x.relacion : (x.dias !== null ? `te debe desde el ${fLarga(x.desde)}` : ''), h);
  }
  function detalleTarjeta(nombre) {
    const t = D.tarjetas.find(x => x.nombre === nombre); if (!t) return;
    const grupos = {}; for (const q of t.cuotas || []) (grupos[q.fecha] = grupos[q.fecha] || []).push(q);
    let h = `<div class="libro tres" style="margin-top:12px"><div><div class="k">Debes</div><div class="v num">${esc(pesos(t.deuda))}</div></div><div><div class="k">Mínimo</div><div class="v num">${esc(pesos(t.minimo))}</div></div><div><div class="k">Cupo libre</div><div class="v num">${t.disponible === null ? '—' : esc(pesos(t.disponible))}</div></div></div>` +
      `<p class="tenue">El mínimo suma las cuotas que vencen hasta el ${esc(fLarga(t.prox))}. Si no cuadra con tu extracto, puede haber cuotas viejas sin marcar como pagadas.</p>`;
    h += Object.keys(grupos).sort().map(f => { const qs = grupos[f], s = qs.reduce((a, q) => a + q.valor, 0);
      return `<h4>${f <= t.prox ? 'Para el ' : 'Pago del '}${esc(fLarga(f))} <span class="tenue num">${esc(pesos(s))}</span></h4><div class="libro filas">` + qs.map(q => fila('', esc(bonito(q.x)), q.de > 1 ? `cuota ${q.n} de ${q.de}` : 'una sola cuota', esc(pesos(q.valor)))).join('') + '</div>'; }).join('') ||
      '<div class="libro vacio">No hay cuotas pendientes registradas.</div>';
    h += `<button class="mas" data-movs-cuenta="${esc(nombre)}">Ver movimientos de la tarjeta</button>`;
    abrirHoja(nombre, `próximo pago el ${fLarga(t.prox)}`, h);
  }
  function detalleAcreedor(nombre) {
    const a = D.acreedores.find(x => x.nombre === nombre); if (!a) return;
    let h = `<div class="libro tres" style="margin-top:12px"><div><div class="k">Le debes</div><div class="v num">${esc(pesos(a.monto))}</div></div><div><div class="k">Te prestó</div><div class="v num">${esc(pesos(a.recibidos.reduce((s, x) => s + x.m, 0)))}</div></div><div><div class="k">Le has pagado</div><div class="v num">${esc(pesos(a.pagados.reduce((s, x) => s + x.m, 0)))}</div></div></div>`;
    h += `<h4>Lo que te prestó</h4><div class="libro filas">` + (a.recibidos.map(x => fila(x.f, esc(x.x), x.c ? 'llegó a ' + esc(x.c) : '', esc(pesos(x.m)))).join('') || '<div class="vacio">Sin registros.</div>') + '</div>';
    h += `<h4>Lo que le has pagado</h4><div class="libro filas">` + (a.pagados.map(x => fila(x.f, esc(x.x), x.c ? 'desde ' + esc(x.c) : '', esc(pesos(x.m)))).join('') || '<div class="vacio">Todavía no le has pagado.</div>') + '</div>';
    h += `<button class="mas" data-movs-persona="${esc(nombre)}">Ver todos los movimientos con ${esc(nombre)}</button>`;
    abrirHoja(nombre, 'lo que tú le debes', h);
  }
  function detalleCuenta(id) {
    const c = D.cuentas.find(x => x.id === id); if (!c) return;
    const ms = D.movimientos.filter(m => m.c === c.nombre || m.d === c.nombre).slice(0, 15);
    const h = `<div class="libro tres" style="margin-top:12px; grid-template-columns:1fr"><div><div class="k">Saldo</div><div class="v num" style="font-size:24px">${esc(pesos(c.saldo))}</div></div></div><h4>Últimos movimientos</h4><div class="libro filas">` +
      (ms.map(m => { const entra = m.s > 0 || (m.s === 0 && m.d === c.nombre); return fila(m.f, esc(bonito(m.x) || m.t), esc(m.t) + (m.d && m.c === c.nombre ? ' hacia ' + esc(m.d) : m.d === c.nombre ? ' desde ' + esc(m.c) : ''), (entra ? '+' : '−') + esc(pesos(m.m).replace('-', ''))); }).join('') || '<div class="vacio">Sin movimientos recientes.</div>') +
      `</div><button class="mas" data-movs-cuenta="${esc(c.nombre)}">Ver todos los movimientos</button>`;
    abrirHoja(c.nombre, c.tipo + (c.vence ? `, vence el ${fLarga(c.vence)}` : ''), h);
  }

  // ---------- Eventos (delegados) ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('button, [data-abrir]'); if (!t) return;
    if (t.dataset.tab) return ir(t.dataset.tab);
    if (t.dataset.ir) return ir(t.dataset.ir, t.dataset.ancla ? () => { const a = $(t.dataset.ancla); if (a) a.scrollIntoView({ behavior: 'smooth', block: 'start' }); } : null);
    if (t.dataset.mes) { mesGastos = t.dataset.mes; return pintarGastos(); }
    if (t.dataset.cat) return verMovimientos({ 'm-cat': t.dataset.cat, 'm-tipo': 'Gasto', 'm-desde': mesGastos + '-01', 'm-hasta': mesGastos + '-31' });
    if (t.dataset.quitar) { $(t.dataset.quitar).value = ''; movVisibles = 60; return pintarMovimientos(); }
    if (t.dataset.movsPersona) return verMovimientos({ 'm-persona': t.dataset.movsPersona });
    if (t.dataset.movsCuenta) return verMovimientos({ 'm-cuenta': t.dataset.movsCuenta });
    if (t.dataset.plegar) { const id = t.dataset.plegar, abierta = t.getAttribute('aria-expanded') !== 'true';
      t.setAttribute('aria-expanded', String(abierta)); const h = $('h-' + id); if (h) h.hidden = !abierta; if (abierta) abiertas.add(id); else abiertas.delete(id); return; }
    if (t.dataset.abrir) { const i = t.dataset.abrir.indexOf(':'), tipo = t.dataset.abrir.slice(0, i), val = t.dataset.abrir.slice(i + 1);
      if (tipo === 'persona') return detallePersona(val); if (tipo === 'tarjeta') return detalleTarjeta(val); if (tipo === 'acreedor') return detalleAcreedor(val); if (tipo === 'cuenta') return detalleCuenta(val); }
  });
  $('hoja-cerrar').addEventListener('click', cerrarHoja);
  hoja.addEventListener('click', e => { if (e.target === hoja) cerrarHoja(); });   // toque fuera del panel
  ['m-buscar', 'm-tipo', 'm-cuenta', 'm-persona', 'm-cat', 'm-desde', 'm-hasta'].forEach(id => $(id).addEventListener('input', () => { movVisibles = 60; pintarMovimientos(); }));
  $('m-mas').addEventListener('click', () => { movVisibles += 120; pintarMovimientos(); });
  $('recargar').addEventListener('click', cargar);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(); });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', pintar);
  try { const t = localStorage.getItem('tablero.tab'); if (t && $(t)) ir(t); } catch (e) {}
  setInterval(() => { if (!document.hidden) cargar(); }, REFRESCO_MS);
  cargar();
})();
</script>
</body>
</html>
